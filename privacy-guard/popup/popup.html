<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Privacy Guard</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="container">
        <h1>Privacy Guard</h1>

        <p class="status">
            Extensão ativa
        </p>

        <section>
            <h2>Página atual</h2>
            <p id="page-url">Carregando...</p>
        </section>

        <section class="score">
            <h2>Privacy Score</h2>
            <strong>-- / 100</strong>
        </section>

        <section>
            <h2>Detecções</h2>

            <div class="item">
                <span>Domínios de terceira parte</span>
                <span id="third-party-count">0</span>
            </div>

            <div id="third-party-section">
                <ul id="third-party-list"></ul>
            </div>

            <div class="item">
                <span>Cookies</span>
                <span id="cookie-total">0</span>
            </div>

            <div class="cookie-details">

                <div class="subitem">
                    <span>Primeira parte</span>
                    <span id="cookie-first-party">0</span>
                </div>

                <div class="subitem">
                    <span>Terceira parte</span>
                    <span id="cookie-third-party">0</span>
                </div>

                <div class="subitem">
                    <span>Sessão</span>
                    <span id="cookie-session">0</span>
                </div>

                <div class="subitem">
                    <span>Persistentes</span>
                    <span id="cookie-persistent">0</span>
                </div>

            </div>

            <div class="item">
                <span>Storage</span>
                <span>--</span>
            </div>

            <div class="item">
                <span>Canvas fingerprinting</span>
                <span>--</span>
            </div>
        </section>
    </main>

    <script src="popup.js"></script>
</body>
</html>
